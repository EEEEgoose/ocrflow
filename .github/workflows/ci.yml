name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run tests
        run: node --test tests/*.test.cjs
      - name: Test Marker task API
        run: |
          python3 -m pip install -r server/requirements-test.txt
          cd server
          python3 -m unittest -v test_marker_jobs
      - name: Build XPI and source archive
        env:
          RELEASE_BUILD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_BUILD" = "true" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/ocrflow-release-tags"
            version=$(python3 -c 'import json,re,sys; from pathlib import Path; base=json.load(open("manifest.json"))["version"]; prefix,patch=base.rsplit(".",1); tags=Path(sys.argv[1]).read_text().splitlines(); numbers=[int(patch)-1]+[int(m.group(1)) for tag in tags if (m:=re.fullmatch("v?"+re.escape(prefix)+r"\.(\d+)",tag))]; print(prefix+"."+str(max(numbers)+1))' "$RUNNER_TEMP/ocrflow-release-tags")
            python3 build.py --version "$version"
            previous=$(python3 -c 'from pathlib import Path; import sys; tags=Path(sys.argv[1]).read_text().splitlines(); print(max(tags,key=lambda tag:tuple(map(int,tag.lstrip("v").split(".")))) if tags else "")' "$RUNNER_TEMP/ocrflow-release-tags")
            python3 release_notes.py --version "$version" ${previous:+--previous-ref "$previous"} --output dist/release-notes.md
            echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          else
            python3 build.py
          fi
      - name: Publish Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = "false" ]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "OCRFlow $RELEASE_VERSION" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$tag" "dist/ocrflow-$RELEASE_VERSION.xpi" "dist/ocrflow-$RELEASE_VERSION-source.zip" dist/updates.json --clobber
          gh release edit "$tag" --notes-file dist/release-notes.md --draft=false --latest
