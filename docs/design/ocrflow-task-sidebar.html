<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCRFlow · 右侧任务面板设计稿</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#e9e9ec,#151517);--window:light-dark(#fff,#242426);--native:light-dark(#f1f1f3,#2e2e30);--list:light-dark(#fff,#202022);--panel:light-dark(#fbfbfc,#27272a);--field:light-dark(#fff,#303034);--text:light-dark(#29292e,#ededf0);--muted:light-dark(#6e6e78,#a6a6b0);--line:light-dark(#dedee4,#414147);--soft:light-dark(#f2f3f7,#303035);--blue:light-dark(#205fbd,#9cbeff);--blue-soft:light-dark(#eaf0fa,#303b50);--primary:light-dark(#2260bd,#a6c2ff);--on-primary:light-dark(#fff,#1b2945);--green:light-dark(#377751,#8dc7a3);--amber:light-dark(#8d6323,#dfba78);--red:light-dark(#ad4841,#efa19a)}
*{box-sizing:border-box}body{margin:0;padding:24px 18px;background:var(--bg);color:var(--text);font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,a,summary{cursor:pointer}button:disabled{opacity:.45;cursor:default}button{border:1px solid var(--line);border-radius:6px;background:var(--field);padding:6px 11px}a{color:var(--blue)}button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}button.quiet{background:transparent;border-color:transparent;color:var(--muted)}button.danger{color:var(--red)}input,select{border:1px solid var(--line);border-radius:6px;background:var(--field);padding:6px 9px;min-width:0}h1,h2,h3,p{margin:0}h1,h2,h3,strong{font-weight:500}h1{font-size:17px}h2{font-size:15px}h3{font-size:13px}small{font-size:11px;color:var(--muted)}
.preview{max-width:1440px;margin:0 auto 13px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.preview-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.preview-tools label{display:flex;gap:7px;align-items:center}.preview-tools button,.preview-tools select{font-size:12px}.window{max-width:1440px;margin:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--window)}.titlebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:38px;padding:0 15px;background:var(--native);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.dots{display:flex;gap:7px}.dots span{width:10px;height:10px;border-radius:50%}.dots span:nth-child(1){background:#ff6058}.dots span:nth-child(2){background:#ffbd2e}.dots span:nth-child(3){background:#28c840}.titlebar .context{justify-self:end}
.workspace{display:grid;grid-template-columns:180px minmax(0,1fr) 352px 44px;grid-template-areas:"collections library activity rail";min-height:580px}.collections{grid-area:collections;padding:18px 10px;background:var(--native);border-right:1px solid var(--line);color:var(--muted);display:flex;flex-direction:column;min-width:0}.collection{padding:7px 10px;display:flex;gap:8px;align-items:center}.collection.child{padding-left:23px}.collection.selected{background:var(--soft);border-radius:5px;color:var(--text)}.collections .divider{height:1px;background:var(--line);margin:17px 0}.collection-footer{margin-top:auto;padding:14px 10px;color:var(--muted);font-size:11px}.library{grid-area:library;min-width:0;background:var(--list)}.library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted)}.library-tools{display:flex;gap:15px;font-size:15px}.library-search{max-width:220px;min-width:70px;width:48%;font-size:12px;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:5px 8px}.list-heading{display:grid;grid-template-columns:minmax(0,1fr) 95px;gap:12px;padding:8px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.document-row{display:grid;grid-template-columns:19px minmax(0,1fr) 95px;gap:9px;width:100%;border:0;border-bottom:1px solid color-mix(in srgb,var(--line) 40%,transparent);border-radius:0;background:transparent;text-align:left;padding:11px 16px;align-items:center}.document-row:nth-child(even){background:color-mix(in srgb,var(--soft) 40%,transparent)}.document-row[aria-selected=true]{background:var(--blue-soft)}.document-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.document-row .author{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.doc-symbol{color:var(--blue);font-size:16px}.library-caption{padding:20px 16px;color:var(--muted);font-size:12px}
.activity{grid-area:activity;min-width:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}.panel-head{padding:15px 18px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-brand{display:flex;align-items:center;gap:9px}.plugin-icon{width:23px;height:23px}.panel-head .subline{color:var(--muted);font-size:11px}.panel-head .fold{padding:3px 8px;font-size:18px}.panel-content{padding:18px 20px 16px;flex:1;min-width:0}.context-label{color:var(--muted);font-size:11px;margin-bottom:7px}.source-title{font-size:15px;font-weight:500;margin-bottom:5px;overflow-wrap:anywhere}.source-file{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.task-status{display:flex;align-items:center;gap:7px;margin:16px 0 18px;color:var(--blue);font-size:12px}.state-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}.task-status.waiting{color:var(--amber)}.task-status.failed{color:var(--red)}.task-status.done{color:var(--green)}
.timeline{list-style:none;padding:0;margin:0}.step{position:relative;padding:0 0 20px 27px;min-width:0}.step:before{content:"";position:absolute;left:6px;top:18px;bottom:0;border-left:1px solid var(--line)}.step:last-child:before{display:none}.step-mark{position:absolute;left:0;top:0;width:14px;text-align:center;color:var(--muted);font-size:12px}.step.done .step-mark{color:var(--green)}.step.active .step-mark{color:var(--blue)}.step.failed .step-mark{color:var(--red)}.step summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;outline-offset:4px}.step summary::-webkit-details-marker{display:none}.step details summary:after{content:"⌄";color:var(--muted);font-size:11px}.step details[open] summary:after{content:"⌃"}.step-title{font-weight:500}.step-hint{color:var(--muted);font-size:11px;margin-top:4px}.step-details{color:var(--muted);font-size:12px;padding-top:7px;overflow-wrap:anywhere}.tool-run{background:var(--soft);border-radius:7px;padding:12px;margin-top:10px}.tool-label{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}.tool-run p{font-size:12px;margin-top:7px}.progress-label{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin:12px 0 7px}.progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.progress-fill{height:100%;background:var(--blue);border-radius:2px}.pending-steps{border-top:1px solid var(--line);padding-top:13px;color:var(--muted);font-size:12px}.pending-steps ol{padding-left:20px;margin:9px 0 0}.pending-steps li{padding:3px 0}
.attention{border:1px solid var(--line);border-radius:8px;padding:14px;margin:5px 0 17px}.attention h3{color:var(--amber);margin-bottom:6px}.attention.failed h3{color:var(--red)}.attention p{font-size:12px;color:var(--muted)}.attention .actions{margin-top:12px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.error-detail{color:var(--muted);font-size:11px;white-space:pre-wrap;margin:10px 0}.output-file{display:flex;gap:8px;align-items:flex-start;background:var(--soft);padding:12px;border-radius:7px;margin:5px 0 14px}.output-file p{font-size:12px;overflow-wrap:anywhere}.output-file small{display:block;margin-top:3px}.empty-state{padding:24px 0;color:var(--muted);font-size:12px}.empty-state h2{color:var(--text);margin-bottom:8px}.empty-state .actions{margin-top:16px}.elsewhere{font-size:11px;border-top:1px solid var(--line);padding-top:13px;margin-top:16px;color:var(--muted)}.elsewhere button{font-size:11px;padding:0;border:0;background:transparent;color:var(--blue)}
.panel-footer{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel);font-size:12px}.panel-footer a{text-decoration:none}.panel-footer .secondary{color:var(--muted);font-size:11px}.rail{grid-area:rail;border-left:1px solid var(--line);padding-top:9px;background:var(--native);display:flex;flex-direction:column;align-items:center;gap:7px}.rail-native{width:34px;height:32px;display:grid;place-items:center;color:var(--muted);font-size:18px}.rail-separator{height:1px;background:var(--line);width:22px;margin:5px 0}.rail-button{position:relative;border:0;border-radius:6px;background:var(--blue-soft);padding:7px;display:grid;place-items:center;width:34px;height:36px}.rail-button img{width:22px;height:22px}.rail-button[aria-expanded=false]{background:transparent}.rail-badge{position:absolute;right:-1px;top:-2px;border-radius:7px;background:var(--primary);color:var(--on-primary);font-size:9px;min-width:13px;height:13px;line-height:13px;text-align:center}.rail-badge[hidden]{display:none}.panel-closed.workspace{grid-template-columns:180px minmax(0,1fr) 44px;grid-template-areas:"collections library rail"}.panel-closed .activity{display:none}.design-note{max-width:1440px;margin:12px auto 0;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.toast{max-width:1440px;margin:10px auto;min-height:22px;font-size:12px;color:var(--muted)}
@media(max-width:1100px){.workspace{grid-template-columns:minmax(0,1fr) 340px 42px;grid-template-areas:"library activity rail"}.collections{display:none}.panel-closed.workspace{grid-template-columns:minmax(0,1fr) 42px;grid-template-areas:"library rail"}.document-row{grid-template-columns:17px minmax(0,1fr)}.document-row .author,.list-heading span:last-child{display:none}.list-heading{grid-template-columns:1fr}.library-search{width:50%}.titlebar .context{display:none}}
@media(max-width:700px){body{padding:12px 8px}.preview{align-items:flex-start}.preview-tools{width:100%}.preview-tools label{flex:1;min-width:0}.preview-tools select{width:100%}.workspace{grid-template-columns:minmax(0,1fr) 40px;grid-template-areas:"activity rail";min-height:660px}.library{display:none}.activity{border-left:0}.panel-closed .library{display:block}.panel-closed.workspace{grid-template-columns:minmax(0,1fr) 40px;grid-template-areas:"library rail"}.panel-content{padding:18px 19px}.titlebar{grid-template-columns:1fr auto 1fr}.panel-footer{padding:13px 16px}.design-note{display:block}.design-note span{display:block;margin-bottom:6px}}
@media(prefers-reduced-motion:no-preference){.panel-content{transition:background-color .15s}}
</style>

<script>

  {id:'b',title:'地中海的历史与文明',file:'地中海的历史与文明.epub',author:'—',kind:'提取全文',scene:'queued'},
  {id:'c',title:'Une histoire de la Méditerranée',file:'histoire.md',author:'—',kind:'翻译文档',scene:'translation-failed'},
  {id:'d',title:'世界史 · 古代史编',file:'世界史.pdf',author:'—',kind:'一键整理',scene:'completed'},
  {id:'e',title:'历史研究方法与材料',file:'历史研究方法.pdf',author:'—',kind:'一键整理',scene:'idle'}];
 const stages=[['read','读取原文件','PDF · 96 页，原文件已就绪。'],['ocr','主识别','MinerU · 官方云端，保留逐页识别结果。'],['structure','恢复文献结构','恢复脚注与图注，衔接跨页段落，保留页码来源。'],['compare','独立对照识别','PaddleOCR · 官方 API，独立识别后比较文字分歧。'],['save','保存全文','Markdown、HTML、原始响应及整理差异报告。'],['metadata','补充书目信息','依据全文补充空缺字段，保留已有条目信息。']];
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const params=new URLSearchParams(location.search);let selected=docs.find(d=>d.id===params.get('document'))||docs[0],open=true;
 const allowed=['ocr','structure','compare','review','failed','completed','idle','queued','canceled','translation-failed','translating','partial'];
 if(allowed.includes(params.get('scene')))selected.scene=params.get('scene');
 function toast(text){document.getElementById('task-toast').textContent=text;}
 function status(text,type=''){return `<div class="task-status ${type}"><span class="state-dot"></span>${text}</div>`;}
 function finished(index){const stage=stages[index];return `<li class="step done"><span class="step-mark" aria-hidden="true">✓</span><details><summary><span class="step-title">${stage[1]}</span></summary><p class="step-details">${stage[2]}</p></details></li>`;}
 function running(index){
  const [id,title]=stages[index],label=id==='ocr'?'MinerU · 官方云端':id==='compare'?'PaddleOCR · 官方 API':'结构整理';
  const text=id==='ocr'?'正在将原始 PDF 转录为可引用的正文。':id==='compare'?'对照识别独立进行，底稿与原始结果继续保留。':'正在检查脚注引用、图注位置与跨页断段。';
  const progress=id==='structure'?'<p class="step-hint">按页核对结构，不改写原文。</p>':`<div class="progress-label"><span>已处理</span><span>${id==='ocr'?'32':'20'} / 96 页</span></div><div class="progress-track" role="progressbar" aria-label="${title}页数进度" aria-valuenow="${id==='ocr'?32:20}" aria-valuemin="0" aria-valuemax="96"><div class="progress-fill" style="width:${id==='ocr'?33.333:20.833}%"></div></div>`;
  return `<li class="step active"><span class="step-mark" aria-hidden="true">●</span><h3>${title}</h3><div class="tool-run"><div class="tool-label"><span>${label}</span><span>执行中</span></div><p>${text}</p>${progress}</div></li>`;
 }
 function history(count,sourceOnly=false){return `<ol class="timeline">${Array.from({length:count},(_,i)=>sourceOnly&&i===3?'<li class="step"><span class="step-mark">○</span><h3>对照识别未完成</h3><p class="step-hint">保留底稿，稍后可以单独重试。</p></li>':finished(i)).join('')}</ol>`;}
 function nextSteps(index){const pending=stages.slice(index+1);return `<details class="pending-steps"><summary>后续 ${pending.length} 个步骤</summary><ol>${pending.map(s=>`<li>${s[1]}</li>`).join('')}</ol></details>`;}
 function currentBody(doc){
  const scene=doc.scene;
  if(['ocr','structure','compare'].includes(scene)){const index=stages.findIndex(s=>s[0]===scene);return status(doc.kind+' · 正在执行')+`<ol class="timeline">${Array.from({length:index},(_,i)=>finished(i)).join('')}${running(index)}</ol>`+nextSteps(index)+`<div class="actions" style="margin-top:20px"><button type="button" class="quiet" data-action="stop">终止此任务</button></div>`;}
  if(scene==='review')return status('整理已完成 · 需要你校勘','waiting')+history(6)+`<div class="attention"><h3>3 组识别分歧待确认</h3><p>全文已保存。请对照原图判断，未确认的文字保持底稿读法。</p><div class="actions"><button type="button" class="primary" data-action="review">对照原图校勘</button><button type="button" class="quiet" data-action="later">稍后处理</button></div></div>`;
  if(scene==='failed')return status('对照识别未完成','failed')+history(3)+`<ol class="timeline"><li class="step failed"><span class="step-mark" aria-hidden="true">!</span><h3>独立对照识别</h3><div class="attention failed" style="margin-top:10px"><h3>PaddleOCR 请求超时</h3><p>底稿与已完成步骤已保留。重试将只执行对照识别。</p><details><summary>错误详情</summary><p class="error-detail">PaddleOCR · 官方 API\n未获得完整的逐页结果。\n未将未完成校勘标记为通过。</p></details><div class="actions"><button type="button" class="primary" data-action="retry">重试此步骤</button><button type="button" data-action="keep-source">保留底稿</button></div></div></li></ol>`;
  if(scene==='translation-failed')return status('翻译需要处理','failed')+`<ol class="timeline"><li class="step done"><span class="step-mark">✓</span><h3>读取 Markdown</h3><p class="step-hint">36 个自然段，原文与译文按段落 ID 对齐。</p></li><li class="step active"><span class="step-mark">!</span><h3>部分译段未完成</h3><div class="tool-run"><p>已完成 28 / 36 段，8 段请求超时。</p><p class="step-hint">已完成的译段会保留。</p></div></li></ol><div class="actions"><button type="button" class="primary" data-action="retry">重试失败段落</button><button type="button" data-action="save-partial">保存部分译文</button><button type="button" class="quiet" data-action="stop">放弃剩余翻译</button></div>`;
  if(scene==='translating')return status('翻译文档 · 正在重试失败段落')+`<ol class="timeline"><li class="step done"><span class="step-mark">✓</span><h3>保留已完成译段</h3><p class="step-hint">28 个自然段已经完成，保持原有对应关系。</p></li><li class="step active"><span class="step-mark">●</span><h3>补译剩余 8 段</h3><div class="tool-run"><div class="tool-label"><span>翻译模型</span><span>执行中</span></div><p>仅处理上次未完成的自然段。</p><div class="progress-label"><span>文献整体译段</span><span>28 / 36 段</span></div><div class="progress-track" role="progressbar" aria-label="翻译段落进度" aria-valuenow="28" aria-valuemin="0" aria-valuemax="36"><div class="progress-fill" style="width:77.78%"></div></div></div></li></ol><div class="actions"><button type="button" class="quiet" data-action="stop">终止翻译</button></div>`;
  if(scene==='partial')return status('已保存部分译文','waiting')+`<div class="output-file"><span class="doc-symbol">▤</span><div><p>${esc(doc.title)} · 部分译文</p><small>已完成 28 / 36 段</small></div></div><p class="step-hint">其余 8 段保留原文，并标明尚未翻译。</p><div class="actions" style="margin-top:16px"><button type="button" class="primary" data-action="open-output">打开部分译文</button></div>`;
  if(scene==='completed')return status(doc.sourceOnly?'底稿已保存 · 对照未完成':'任务已完成',doc.sourceOnly?'waiting':'done')+history(doc.kind==='翻译文档'?0:6,doc.sourceOnly)+`<div class="output-file"><span class="doc-symbol" aria-hidden="true">▤</span><div><p>${esc(doc.title)}${doc.kind==='翻译文档'?' · 译文':''}</p><small>Markdown / HTML 已保存</small></div></div><div class="actions"><button type="button" class="primary" data-action="open-output">打开全文</button><button type="button" data-action="changes">查看整理差异</button>${doc.sourceOnly?'<button type="button" data-action="retry">重试对照识别</button>':''}</div>`;
  if(scene==='queued')return status('已加入队列')+`<div class="empty-state"><h2>等待前一文献完成</h2><p>轮到此文献后，这里将显示它的执行步骤和实际进度。</p><div class="actions"><button type="button" class="quiet" data-action="stop">移出队列</button></div></div>`;
  if(scene==='canceled')return status('任务已终止')+`<div class="empty-state"><h2>已停止后续处理</h2><p>已经保存的原始结果和全文保留。</p><div class="actions"><button type="button" data-action="start">重新处理</button></div></div>`;
  return `<div class="empty-state"><h2>此文献还没有任务</h2><p>可以从右键菜单启动处理，也可以在这里开始一键整理。</p><div class="actions"><button type="button" class="primary" data-action="start">一键整理</button></div></div>`;
 }
 function render(){
  document.getElementById('document-list').innerHTML=docs.map(d=>`<button type="button" class="document-row" role="option" aria-selected="${d.id===selected.id}" data-document="${d.id}"><span class="doc-symbol" aria-hidden="true">▤</span><span class="document-title">${esc(d.title)}</span><span class="author">${esc(d.author)}</span></button>`).join('');
  const active=docs.filter(d=>['ocr','structure','compare','translating'].includes(d.scene)),elsewhere=active.find(d=>d.id!==selected.id);
  content.innerHTML=`<p class="context-label">当前选中文献</p><h2 class="source-title">${esc(selected.title)}</h2><p class="source-file">${esc(selected.file)}</p>${currentBody(selected)}${elsewhere?`<div class="elsewhere">另有任务正在执行：<button type="button" data-document="${elsewhere.id}">查看 ${esc(elsewhere.title)} →</button></div>`:''}`;
  workspace.classList.toggle('panel-closed',!open);root.querySelector('#ocrflow-rail-button').setAttribute('aria-expanded',String(open));
  const badge=root.querySelector('#running-badge');badge.textContent=active.length;badge.hidden=!active.length;
  root.querySelector('#background-status').textContent=active.length?'任务在后台执行':'当前文献的工作记录';
  sceneSelect.value=[...sceneSelect.options].some(o=>o.value===selected.scene)?selected.scene:'';
 }
 root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.document){selected=docs.find(d=>d.id===button.dataset.document);render();return;}const action=button.dataset.action;
  if(action==='toggle-panel'){open=!open;render();}
  if(action==='start'){selected.kind='一键整理';selected.scene=docs.some(d=>d.id!==selected.id&&['ocr','structure','compare','translating'].includes(d.scene))?'queued':'ocr';selected.sourceOnly=false;open=true;render();toast(selected.scene==='queued'?'演示：任务已加入队列，自动展开该文献进度。':'演示：任务开始后，OCRFlow 右侧面板自动展开。');}
  if(action==='stop'){selected.scene='canceled';render();toast('演示：后续处理已停止，已保存的结果保留。');}
  if(action==='retry'){selected.sourceOnly=false;selected.scene=selected.scene==='translation-failed'?(docs.some(d=>d.id!==selected.id&&['ocr','structure','compare','translating'].includes(d.scene))?'queued':'translating'):'compare';render();toast('演示：只重试未完成的步骤，保留已经完成的结果。');}
  if(action==='keep-source'){selected.scene='completed';selected.sourceOnly=true;render();toast('底稿已保存；对照识别保持未完成状态。');}
  if(action==='save-partial'){selected.scene='partial';render();toast('部分译文已保存，未翻译内容保留原文并标明。');}
  if(action==='later')toast('全文已保存；疑字继续保持待校勘，不阻塞其他文献。');
  if(action==='review')toast('原图校勘入口：实际插件在这里进入该文献的校勘视图。');
  if(action==='open-output')toast('全文入口：实际插件在这里打开已保存的全文附件。');
  if(action==='changes')toast('整理差异入口：实际插件在这里打开本次内容差异报告。');
 });
 sceneSelect.addEventListener('change',()=>{const scene=sceneSelect.value;selected=['translation-failed','translating','partial'].includes(scene)?docs[2]:scene==='queued'?docs[1]:scene==='idle'?docs[4]:docs[0];for(const doc of docs)if(doc.id!==selected.id&&['ocr','structure','compare','translating'].includes(doc.scene))doc.scene='queued';selected.scene=scene;selected.sourceOnly=false;open=true;render();toast('当前显示演示状态，不会执行真实任务。');});
 document.querySelector('[data-action="demo-start"]').addEventListener('click',()=>{selected=docs[0];for(const doc of docs)if(doc.id!==selected.id&&['ocr','structure','compare','translating'].includes(doc.scene))doc.scene='queued';selected.scene='ocr';selected.sourceOnly=false;open=true;render();toast('演示：某篇文献开始执行任务，自动展开它的 OCRFlow 进度。');});
 render();
})();
</script>
</body>
</html>
