<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCRFlow · 设置页设计稿</title>
<style>
:root{color-scheme:light dark;--of-canvas:light-dark(#ececee,#171719);--of-surface:light-dark(#ffffff,#252528);--of-nav:light-dark(#f2f2f4,#303032);--of-field:light-dark(#ffffff,#2b2b2e);--of-text:light-dark(#28282c,#ededf0);--of-muted:light-dark(#6d6d77,#b2b2ba);--of-line:light-dark(#dcdce2,#46464c);--of-accent:light-dark(#1765ca,#96baff);--of-selection:light-dark(#e8effb,#303e59);--of-primary:light-dark(#1765ca,#a5c1ff);--of-on-primary:light-dark(#ffffff,#192840);--of-soft:light-dark(#f6f6f8,#2c2c31);--of-danger:light-dark(#a33e35,#f2a69f);--of-shadow:light-dark(#22222815,#00000035)}
*{box-sizing:border-box}
body{margin:0;background:var(--of-canvas);color:var(--of-text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:32px 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
input,select,textarea{min-width:0;max-width:100%;background:var(--of-field);border:1px solid var(--of-line);border-radius:7px;padding:9px 11px}
input::placeholder,textarea::placeholder{color:var(--of-muted)}
input[type=checkbox]{accent-color:var(--of-accent);width:16px;height:16px;margin:3px 0 0;padding:0;flex-shrink:0}
textarea{width:100%;resize:vertical;line-height:1.7}
h1,h2,h3,p{margin:0}h1{font-size:25px;font-weight:500;letter-spacing:-.6px}h2{font-size:16px;font-weight:500}h3{font-size:14px;font-weight:500}
small,.small{font-size:12px;color:var(--of-muted)}
.preview-label{max-width:1120px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--of-muted)}
.window{max-width:1120px;margin:auto;background:var(--of-surface);border:1px solid var(--of-line);border-radius:14px;overflow:hidden;box-shadow:0 12px 48px var(--of-shadow)}
.windowbar{height:38px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;border-bottom:1px solid var(--of-line);background:var(--of-nav);font-size:12px;color:var(--of-muted)}
.windowbar .dots{display:flex;gap:7px}.dots span{width:10px;height:10px;border-radius:50%;background:var(--of-line)}
.dots span:nth-child(1){background:#ff6058}.dots span:nth-child(2){background:#ffbd2e}.dots span:nth-child(3){background:#28c840}
.windowbar .right{justify-self:end}
.host-layout{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--of-nav)}
.host-sidebar{padding:22px 12px;display:flex;flex-direction:column;gap:7px;border-right:1px solid var(--of-line)}
.host-item{padding:13px 14px;border-radius:7px;display:flex;gap:12px;align-items:center;font-size:15px}.host-icon{width:21px;display:inline-flex;justify-content:center;color:var(--of-muted)}
.host-separator{height:1px;background:var(--of-line);margin:16px 0}.host-item.active{background:#0d58b7;color:#fff}.host-item.active .host-icon{color:#fff}.host-caption{font-size:11px;color:var(--of-muted);padding:14px;margin-top:auto}
.host-content{min-width:0;padding:18px 24px 24px}.host-toolbar{display:flex;justify-content:flex-end;margin-bottom:17px}.host-search{border:1px solid var(--of-line);border-radius:7px;background:var(--of-field);color:var(--of-muted);padding:7px 12px;width:220px;font-size:13px}.host-pane-heading{font-size:22px;font-weight:500;margin-bottom:17px}
.plugin-pane{background:var(--of-surface);border-radius:8px;min-width:0}.plugin-header{display:flex;align-items:center;gap:11px;padding:20px 24px 16px}.plugin-header img{width:32px;height:32px}.plugin-header p{font-size:13px;color:var(--of-muted)}.plugin-header .tag{margin-left:auto}
.plugin-tabs{display:flex;flex-wrap:wrap;gap:2px;padding:0 17px;border-bottom:1px solid var(--of-line)}
.navitem{flex:1;min-width:0;white-space:nowrap;text-align:center;padding:12px 8px 11px;border:0;border-bottom:2px solid transparent;background:transparent;margin:0;color:var(--of-muted);font-size:13px}
.navitem[aria-current=page]{border-bottom-color:var(--of-accent);color:var(--of-accent);font-weight:500}.navitem:hover:not([aria-current=page]){background:var(--of-soft);color:var(--of-text)}
.shell{display:block}.main{padding:23px 24px 26px;min-height:535px;min-width:0}.pagehead h1{font-size:20px;letter-spacing:0}
.intro{margin-top:6px;color:var(--of-muted);font-size:12px}.pagehead{margin-bottom:25px}
.section{padding:23px 0;border-top:1px solid var(--of-line)}.section:first-of-type{padding-top:0;border-top:0}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.section-heading p{font-size:12px;color:var(--of-muted);margin-top:4px}
.field{display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px 20px;align-items:start;margin:15px 0}.field>label{padding-top:9px}.field-control{min-width:0}.field-control>input,.field-control>select{width:100%}.help{color:var(--of-muted);font-size:12px;margin-top:6px}.inline-help{margin:12px 0;color:var(--of-muted);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--of-soft);border:1px solid var(--of-line);border-radius:9px;margin-bottom:21px}
.tab{flex:1;padding:7px 13px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--of-muted);white-space:nowrap}.tab[aria-selected=true]{background:var(--of-surface);border-color:var(--of-line);color:var(--of-text);box-shadow:0 1px 3px var(--of-shadow)}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 22px}.pill{border:1px solid var(--of-line);border-radius:6px;padding:7px 12px;background:var(--of-surface);color:var(--of-muted)}.pill[aria-selected=true]{background:var(--of-selection);color:var(--of-accent);border-color:var(--of-selection)}
.mode{display:flex;gap:20px;margin-bottom:19px;flex-wrap:wrap}.mode label{display:flex;align-items:center;gap:7px}.mode input{accent-color:var(--of-accent);margin:0}
.button{background:var(--of-surface);border:1px solid var(--of-line);border-radius:7px;padding:7px 13px;white-space:nowrap}.button.primary{background:var(--of-primary);border-color:var(--of-primary);color:var(--of-on-primary)}.button.quiet{border-color:transparent;background:transparent;color:var(--of-muted)}.button.link{color:var(--of-accent);border:0;padding:0;background:transparent;text-align:left;white-space:normal}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}.actions.aligned{padding-left:165px}.note{padding:12px 15px;background:var(--of-soft);border-radius:7px;font-size:12px;color:var(--of-muted);margin-top:17px}.note strong{font-weight:500;color:var(--of-text)}
.tag{font-size:11px;border:1px solid var(--of-line);padding:2px 7px;border-radius:5px;color:var(--of-muted);white-space:nowrap}.input-group{display:flex;gap:7px;align-items:center}.input-group input{width:100%}.input-group .button{flex-shrink:0}
details{border-top:1px solid var(--of-line);margin-top:22px;padding-top:16px}summary{color:var(--of-muted);font-size:12px;cursor:pointer}details .field{margin:14px 0}.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:15px 0}.numbers label{display:block;font-size:12px;color:var(--of-muted);margin-bottom:6px}.numbers input{width:100%}
.modelbox{padding:18px;border:1px solid var(--of-line);border-radius:9px;margin-top:15px}.modelbox header{display:flex;align-items:center;gap:9px;margin-bottom:11px}.modelbox header .model-index{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--of-soft);font-size:12px;color:var(--of-muted)}.modelbox .field{grid-template-columns:113px minmax(0,1fr);gap:10px 16px}.modelbox .actions{justify-content:flex-end}
.work-title{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}.work-title p{font-size:12px;color:var(--of-muted);margin-top:4px}.model-context{display:flex;gap:7px 16px;flex-wrap:wrap;color:var(--of-muted);font-size:12px;margin-top:8px}
.switchrow{display:flex;align-items:flex-start;gap:11px;padding:16px 0}.switchrow+.switchrow{border-top:1px solid var(--of-line)}.switchrow .switchtext{flex:1}.switchtext strong{font-weight:500;display:block;margin-bottom:3px}.switchtext p{font-size:12px;color:var(--of-muted)}
fieldset{border:0;padding:0;margin:0;min-width:0}fieldset:disabled{opacity:.5}.source-grid{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:16px;align-items:center;margin:22px 0 18px}.source-box{border:1px solid var(--of-line);border-radius:9px;padding:18px;min-width:0}.source-label{display:flex;gap:8px;align-items:center;margin-bottom:12px}.source-letter{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--of-soft);font-size:12px}.source-box select{width:100%;font-size:13px}.source-arrow{text-align:center;color:var(--of-muted)}.flowline{display:flex;flex-wrap:wrap;gap:10px;color:var(--of-muted);font-size:12px;margin-top:20px}.flowline span:nth-child(odd){color:var(--of-text)}
.definition{display:grid;grid-template-columns:145px 1fr;gap:20px;padding:16px 0}.definition+.definition{border-top:1px solid var(--of-line)}.definition dt{color:var(--of-muted)}.definition dd{margin:0}.filelist{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--of-muted);font-size:12px}.filelist span:before{content:'↳';margin-right:5px;color:var(--of-muted)}
.footer{border-top:1px solid var(--of-line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 24px;background:var(--of-surface);border-radius:0 0 8px 8px}.footer .save-status{font-size:12px;color:var(--of-muted)}.footer .save-status.dirty{color:var(--of-accent)}.footer .actions{margin:0;flex-shrink:0}
.toast{max-width:1120px;margin:12px auto 0;min-height:23px;color:var(--of-muted);font-size:12px;text-align:center}.feedback{font-size:12px;color:var(--of-muted);white-space:pre-wrap;margin-top:8px}
.queue-summary{font-size:12px;color:var(--of-muted);margin-bottom:14px}.queue-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}.queue-table th{text-align:left;font-weight:500;color:var(--of-muted);padding:10px 7px;border-bottom:1px solid var(--of-line)}.queue-table td{padding:13px 7px;vertical-align:top;border-bottom:1px solid var(--of-line);overflow-wrap:anywhere}.queue-table th:nth-child(1){width:5%}.queue-table th:nth-child(2){width:27%}.queue-table th:nth-child(3){width:12%}.queue-table th:nth-child(4){width:31%}.queue-table th:nth-child(5){width:25%}.queue-table .queue-file{font-weight:500}.queue-table small{display:block;margin-top:5px;font-size:11px}.queue-row-actions{display:flex;gap:5px;flex-wrap:wrap}.queue-row-actions button,.queue-row-actions a{font:inherit;padding:4px 6px;border:1px solid var(--of-line);border-radius:5px;background:var(--of-field);color:var(--of-text);text-decoration:none;white-space:nowrap}.queue-state{color:var(--of-accent)}.queue-state.failed{color:var(--of-danger)}.queue-state.completed,.queue-state.canceled,.queue-state.queued{color:var(--of-muted)}.queue-feedback{font-size:12px;color:var(--of-muted);margin-top:12px;white-space:pre-wrap}
@media(max-width:900px){body{padding:18px 12px}.host-layout{grid-template-columns:155px minmax(0,1fr)}.host-content{padding:16px}.host-item{font-size:13px;padding:12px 8px}.main{padding:23px 20px}.plugin-header{padding:18px 20px}.plugin-tabs{padding:0 10px}.navitem{font-size:12px;padding:11px 6px}.footer{padding:17px 20px}.field{grid-template-columns:122px minmax(0,1fr);gap:10px 14px}.actions.aligned{padding-left:136px}.tabs .tab{padding:7px 9px}.source-grid{gap:10px}.source-box{padding:13px}.definition{grid-template-columns:122px 1fr;gap:14px}}
@media(max-width:680px){body{padding:10px 8px}.preview-label{font-size:11px}.host-layout{grid-template-columns:1fr}.host-sidebar{display:none}.host-content{padding:14px 10px}.host-toolbar{margin-bottom:14px}.host-pane-heading{font-size:20px}.plugin-header{padding:17px 16px}.plugin-header p{font-size:12px}.plugin-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 10px}.navitem{padding:10px 4px}.main{padding:22px 16px;min-height:500px}.field{grid-template-columns:1fr;gap:6px;margin:17px 0}.field>label{padding-top:0}.actions.aligned{padding-left:0}.source-grid{grid-template-columns:1fr}.source-arrow{display:none}.numbers{gap:9px}.numbers input{font-size:13px}.modelbox .field{grid-template-columns:1fr;gap:6px}.footer{padding:16px;align-items:flex-start;flex-wrap:wrap}.footer .actions{margin-left:auto}.definition{grid-template-columns:1fr;gap:4px}.windowbar .right{display:none}.tab{flex:1 0 28%;font-size:12px}}
@media(pointer:coarse){button{min-height:44px}input,select,textarea{font-size:16px}}
@media(max-width:760px){.queue-table thead{display:none}.queue-table,.queue-table tbody{display:block}.queue-table tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--of-line);padding:10px 0}.queue-table td{display:block;border:0;padding:5px 0}.queue-table td:nth-child(1){font-size:11px;color:var(--of-muted)}.queue-table td:nth-child(2),.queue-table td:nth-child(4),.queue-table td:nth-child(5){grid-column:1/-1}.queue-table td:nth-child(3){grid-row:1;grid-column:2;text-align:right}.queue-table td:nth-child(1):before{content:"任务 "}.queue-row-actions{margin-top:4px}}
</style>
</head>

<script>
(() => {
  const root=document.getElementById('ocrflow-settings-design'), main=root.querySelector('#of-main');
  const pageInfo={extraction:['全文提取','选择默认提取方式，并配置文档转换服务。'],providers:['AI 服务商','在这里管理接口和模型，供各项工作共用。'],work:['工作与模型','为不同工作分配模型，并设置各自的处理方式。'],collation:['双引擎校勘','独立识别，比较分歧，再对照原图确认。'],output:['输出与保存','统一管理全文附件、图片和原文件的关联。'],tasks:['任务队列','集中查看所有文献的工作记录，管理失败项与排队任务。']};
  const workInfo={parent:['建立父条目','仅根据文件名识别初步书目信息。'],metadata:['补充信息','读取全文补充书目，包含非中文题名翻译。'],summary:['总结文档','根据全文生成学术总结笔记。'],ocr:['AI 视觉 OCR','使用支持图片输入的模型识别 PDF 或图片。'],translate:['翻译文档','保留文献结构，按自然段翻译并对齐。'],outline:['阅读器大纲','优先读取 PDF 结构，按需补充目录与章节摘要。']};
  const prompts={parent:'只根据文件名生成初步书目条目，不联网、不猜测。文件名没有明确给出的字段留空。只输出 JSON 对象。',metadata:'根据文档文本补全书目信息，优先核对扉页、版权页、出版说明和论文首页。保留有证据的信息，不把参考文献当作本书信息。',summary:'请用{{language}}撰写学术总结，包含研究问题与背景、材料与方法、主要论证或发现、结论与贡献。忠实于原文，未提供的信息不编造。',ocr:'完整转录图片为 Markdown，保留原文语言、标题层级、表格和公式。不总结，不补写。无法识别的文字用[无法识别]标记。',translate:'Translate the Markdown into {{language}}. Preserve formatting, formulas, tables, links and paragraph alignment. Translate natural language only.',outline:'提取真实章节层级，保留原文标题和 PDF 物理页码。忽略目录页的重复标题，只输出合法 JSON。'};
  const initial={defaultService:'mineru',mineruMode:'cloud',paddleMode:'cloud',mineru:{cloud:{url:'https://mineru.net/api/v4',token:'',model:'vlm',language:'auto',poll:5,timeout:1200,wait:7200},local:{url:'http://127.0.0.1:41835',token:'',model:'standard',poll:5,timeout:1200,wait:7200}},paddle:{cloud:{url:'https://paddleocr.aistudio-app.com/api/v2/ocr',token:'',model:'PaddleOCR-VL-1.6'},local:{url:'http://127.0.0.1:8080',token:'',model:'PaddleOCR-VL-1.6'}},markitdownURL:'http://127.0.0.1:33001',providers:[{id:'main',name:'主用接口',url:'https://api.example.com/v1',key:'',models:[{name:'视觉模型 A',context:'128K',output:'16K',concurrency:2},{name:'文本模型 B',context:'128K',output:'16K',concurrency:2}]}],defaultModel:'main:0',works:Object.fromEntries(Object.keys(workInfo).map(key=>[key,{model:'default',prompt:prompts[key],params:''}])),summaryLanguage:'中文',translateLanguage:'中文',translateFormat:'html',translateMode:'bilingual',translateChunk:20000,translateRetry:2,autoOutline:false,outlineAI:true,dualEnabled:false,sourceA:'mineru-cloud',sourceB:'paddle-cloud',generateHTML:true,imageMode:'folder',linkSource:true,jobID:''};
  let state=structuredClone(initial),saved=structuredClone(initial),page='extraction',service='mineru',providerIndex=0,work='translate',dirty=false;
  const requestedSection=new URLSearchParams(location.search).get('section');if(Object.hasOwn(pageInfo,requestedSection))page=requestedSection;
  const queueDraft=[{id:'a',file:'阿尔及利亚史.pdf',work:'一键整理',service:'MinerU + PaddleOCR',status:'running',progress:'主识别：已处理 32 / 96 页',scene:'ocr'},
    {id:'b',file:'地中海的历史与文明.epub',work:'提取全文',service:'MarkItDown',status:'queued',progress:'等待前一文献完成',scene:'queued'},
    {id:'c',file:'histoire.md',work:'翻译文档',service:'主用接口 / 文本模型 B',status:'failed',progress:'已完成 28 / 36 段；8 段请求超时',scene:'translation-failed'},
    {id:'d',file:'世界史.pdf',work:'一键整理',service:'MinerU + PaddleOCR',status:'completed',progress:'全文与书目信息已保存',scene:'completed'}];
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const get=key=>key.split('.').reduce((obj,part)=>obj?.[part],state);
  function set(key,value){const parts=key.split('.');let obj=state;for(const part of parts.slice(0,-1))obj=obj[part];obj[parts.at(-1)]=value;markDirty();}
  function markDirty(){dirty=true;updateSave();}
  function updateSave(){const status=root.querySelector('#of-save-status');status.textContent=dirty?'有未保存的修改':'尚未修改';status.classList.toggle('dirty',dirty);}
  function toast(message){document.getElementById('of-toast').textContent=message;}
  const id=key=>'of-'+key.replace(/[^a-z0-9]/gi,'-');
  function input(key,{type='text',placeholder='',min}={}){return `<input id="${id(key)}" data-pref="${key}" type="${type}" value="${esc(get(key))}" ${placeholder?`placeholder="${esc(placeholder)}"`:''} ${min!==undefined?`min="${min}"`:''} autocomplete="off">`;}
  function select(key,options,{disabled=false}={}){return `<select id="${id(key)}" data-pref="${key}" ${disabled?'disabled':''}>${options.map(option=>{const [value,label]=Array.isArray(option)?option:[option,option];return `<option value="${esc(value)}" ${String(get(key))===String(value)?'selected':''}>${esc(label)}</option>`;}).join('')}</select>`;}
  function field(label,key,control,help=''){return `<div class="field"><label for="${id(key)}">${label}</label><div class="field-control">${control}${help?`<p class="help">${help}</p>`:''}</div></div>`;}
  function password(key,label){return field(label,key,`<div class="input-group">${input(key,{type:'password',placeholder:'填写访问令牌'})}<button class="button" type="button" data-reveal="${id(key)}" aria-label="显示或隐藏${label}">显示</button></div>`);}
  function toggle(key,title,help){return `<label class="switchrow"><input id="${id(key)}" type="checkbox" data-pref="${key}" ${get(key)?'checked':''}><span class="switchtext"><strong>${title}</strong><p>${help}</p></span></label>`;}
  function section(title,subtitle,body,tag=''){return `<section class="section"><div class="section-heading"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${tag?`<span class="tag">${tag}</span>`:''}</div>${body}</section>`;}
  function tabs(items,current,attribute,extra=''){return `<div class="tabs" role="tablist" aria-label="${extra}">${items.map(([key,label])=>`<button type="button" class="tab" role="tab" aria-selected="${current===key}" ${attribute}="${key}">${label}</button>`).join('')}</div>`;}
  function modelChoices(includeDefault=false){return [...(includeDefault?[['default','跟随默认模型']]:[]),...state.providers.flatMap(p=>p.models.map((model,index)=>[`${p.id}:${index}`,`${p.name} / ${model.name || '未命名模型'}`]))];}
  function modelContext(value){const selected=value==='default'?state.defaultModel:value;const split=selected.lastIndexOf(':'),provider=state.providers.find(p=>p.id===selected.slice(0,split)),model=provider?.models[Number(selected.slice(split+1))];return model?`<div class="model-context"><span>上下文 ${esc(model.context||'32K')}</span><span>最大输出 ${esc(model.output||'按工作默认')}</span><span>并发 ${esc(model.concurrency||1)}</span></div>`:'';}
  function extraction(){
    const defaults=[['mineru','MinerU'],['paddle','PaddleOCR'],['markitdown','MarkItDown'],['ai','AI 视觉 OCR']];
    let body=section('默认提取方式','用于“一键整理”和“使用设置中的服务”。',field('PDF / 图片', 'defaultService',select('defaultService',defaults),'EPUB、Office 和 HTML 等文档仍由 MarkItDown 转换。'));
    let serviceBody=tabs([['mineru','MinerU'],['paddle','PaddleOCR'],['markitdown','MarkItDown'],['ai','AI 视觉']],service,'data-service','转换服务');
    if(service==='mineru'||service==='paddle'){
      const family=service,mode=state[`${family}Mode`],prefix=`${family}.${mode}`,isCloud=mode==='cloud';
      serviceBody+=`<div class="mode" role="group" aria-label="接口类型">${[['cloud','官方云端'],['local','自部署 / 本地']].map(([value,label])=>`<label><input type="radio" name="service-mode" data-mode="${family}" value="${value}" ${mode===value?'checked':''}>${label}</label>`).join('')}</div>`;
      serviceBody+=field('服务地址',`${prefix}.url`,input(`${prefix}.url`,{type:'url'}));
      serviceBody+=password(`${prefix}.token`,isCloud?'访问令牌':'令牌（可选）');
      serviceBody+=field(family==='paddle'&&!isCloud?'部署模型（记录）':family==='mineru'&&!isCloud?'解析档位':'模型',`${prefix}.model`,family==='mineru'?select(`${prefix}.model`,isCloud?[['vlm','vlm · 视觉解析'],['pipeline','pipeline · 标准解析']]:[['flash','Flash'],['basic','Basic'],['standard','Standard'],['advanced','Advanced']]):input(`${prefix}.model`),family==='paddle'&&!isCloud?'实际模型由自部署服务决定。':'');
      if(family==='mineru'){
        if(isCloud)serviceBody+=field('识别语言',`${prefix}.language`,select(`${prefix}.language`,[['auto','自动 · 读取父条目语言'],['server','使用服务默认值'],['ch','中文 / 中英混合'],['chinese_cht','繁体中文'],['en','英文'],['arabic','阿拉伯语'],['latin','法语、德语等拉丁文字'],['japan','日语'],['korean','韩语']]));
        serviceBody+=`<div class="actions aligned"><button type="button" class="button" data-test="MinerU ${isCloud?'云端':'本地'}">测试连接</button></div><details><summary>高级连接参数</summary>${field('轮询间隔（秒）',`${prefix}.poll`,input(`${prefix}.poll`,{type:'number',min:1}))}${field('网络请求超时（秒）',`${prefix}.timeout`,input(`${prefix}.timeout`,{type:'number',min:1}),'单次网络请求的等待时间，默认 1200 秒（20 分钟）；与整项任务的等待上限分开。')}${field('任务等待上限（秒）',`${prefix}.wait`,input(`${prefix}.wait`,{type:'number',min:0}),'0 表示不设等待上限。')}</details>`;
      }
      serviceBody+=`<p class="inline-help">${isCloud?'文件会发送到所选服务解析。':'填写服务根地址；使用用户已有的本地或自部署服务。'}${family==='paddle'?' PaddleOCR 两种接口的配置分别保留。':' MinerU 两种接口的配置分别保留。'}</p>`;
    }else if(service==='markitdown'){
      serviceBody+=field('服务地址','markitdownURL',input('markitdownURL',{type:'url'}),'支持 REST 服务根地址或 MCP 地址。')+`<div class="actions aligned"><button class="button" type="button" data-test="MarkItDown">测试连接</button></div><p class="note">适合 EPUB、Office、HTML 及已有文字层的 PDF。扫描件请选择 MinerU、PaddleOCR 或 AI 视觉 OCR。</p>`;
    }else{
      serviceBody+=`<div class="definition"><dt>服务连接</dt><dd>使用 AI 服务商中配置的接口。</dd></div><div class="definition"><dt>识别模型</dt><dd>使用“工作与模型 → AI 视觉 OCR”的模型分配。</dd></div><div class="actions"><button type="button" class="button" data-page="providers">配置 AI 服务商</button><button type="button" class="button" data-work-link="ocr">选择 OCR 模型</button></div>`;
    }
    return body+section('转换服务配置','每次只展开一类服务，切换时保留已填写内容。',serviceBody);
  }
  function providers(){
    const provider=state.providers[providerIndex],prefix=`providers.${providerIndex}`;
    let body=`<div class="pills" role="tablist" aria-label="服务商配置">${state.providers.map((p,index)=>`<button type="button" class="pill" role="tab" aria-selected="${index===providerIndex}" data-provider="${index}">${esc(p.name)}</button>`).join('')}<button type="button" class="button quiet" data-action="add-provider" ${state.providers.length>=5?'disabled':''}>＋ 添加配置</button></div>`;
    body+=section('接口连接','同一接口下的两个模型共用地址与 Key。',field('配置名称',`${prefix}.name`,input(`${prefix}.name`))+field('API 地址',`${prefix}.url`,input(`${prefix}.url`,{type:'url'}),'填写 Chat Completions 根地址，通常以 /v1 结尾。')+password(`${prefix}.key`,'API Key'));
    body+=section('模型与调用预算','上下文、输出上限和并发集中在模型层设置。',[0,1].map(index=>{const p=`${prefix}.models.${index}`;return `<div class="modelbox"><header><span class="model-index">${index+1}</span><h3>模型 ${index+1}</h3></header>${field('模型名称',`${p}.name`,input(`${p}.name`,{placeholder:'填写服务商提供的模型标识'}))}<div class="numbers"><div><label for="${id(p+'.context')}">上下文窗口</label>${input(p+'.context',{placeholder:'默认 32K'})}</div><div><label for="${id(p+'.output')}">最大输出长度</label>${input(p+'.output',{placeholder:'如 8K / 16K'})}</div><div><label for="${id(p+'.concurrency')}">并发请求数</label>${input(p+'.concurrency',{type:'number',min:1})}</div></div><div class="actions"><span class="small">支持 K / M 单位</span><button type="button" class="button" data-test="${esc(provider.name)} · 模型 ${index+1}">测试此模型</button></div></div>`;}).join(''));
    body+=`<div class="actions"><button type="button" class="button quiet" data-action="delete-provider" ${state.providers.length===1?'disabled':''}>删除当前配置</button></div>`;
    return body;
  }
  function workView(){
    const info=workInfo[work],prefix=`works.${work}`;
    let body=section('默认工作模型','未单独分配的工作跟随此模型。',field('默认模型','defaultModel',select('defaultModel',modelChoices())+modelContext(state.defaultModel)));
    let detail=tabs(Object.entries(workInfo).map(([key,value])=>[key,value[0]]),work,'data-work','工作类型');
    detail+=`<div class="work-title"><div><h2>${info[0]}</h2><p>${info[1]}</p></div></div>`;
    detail+=field('使用模型',`${prefix}.model`,select(`${prefix}.model`,modelChoices(true))+modelContext(get(`${prefix}.model`)));
    if(work==='summary')detail+=field('总结语言','summaryLanguage',select('summaryLanguage',['中文','English','日本語']));
    if(work==='translate'){
      detail+=field('目标语言','translateLanguage',select('translateLanguage',['中文','English','日本語','Français','Deutsch']));
      detail+=field('保存格式','translateFormat',select('translateFormat',[['md','Markdown'],['html','HTML']]));
      detail+=field('阅读模式','translateMode',select('translateMode',[['translation','仅译文'],['bilingual','原文 / 译文双栏']],{disabled:state.translateFormat!=='html'}),'双栏按自然段一一对应，适合对照原文阅读。');
      detail+=`<details><summary>分段与重试</summary>${field('分段字符数','translateChunk',input('translateChunk',{type:'number',min:1}),'请求可包含多段，显示仍按自然段对齐。')}${field('自动重试次数','translateRetry',input('translateRetry',{type:'number',min:0}))}</details>`;
    }
    if(work==='outline')detail+=toggle('autoOutline','解析完成后自动生成大纲','关闭时可在右键菜单中手动生成。')+toggle('outlineAI','使用 AI 补充目录和章节摘要','模型使用上方分配，优先保留 PDF 中已有的结构。');
    if(work==='ocr')detail+=`<p class="note">所选模型须支持图片输入。MinerU 和 PaddleOCR 不使用这里的 AI 视觉模型。</p>`;
    detail+=`<details><summary>提示词与请求参数</summary><div class="field"><label for="${id(prefix+'.prompt')}">任务提示词</label><div class="field-control"><textarea rows="5" id="${id(prefix+'.prompt')}" data-pref="${prefix}.prompt">${esc(get(prefix+'.prompt'))}</textarea><div class="actions"><button type="button" class="button" data-action="reset-prompt">恢复内置提示词</button><span class="small">此处展示用于评审布局的提示词节选</span></div></div></div><details><summary>查看内置提示词参考</summary><p class="note">${esc(prompts[work])}</p></details>${['parent','metadata'].includes(work)?`<div class="field"><label>固定输出格式</label><div class="field-control"><textarea rows="3" readonly aria-label="固定书目输出格式">JSON：itemType、title、shortTitle、date、publisher、ISBN、DOI、language、creators…</textarea></div></div>`:''}${field('请求参数 JSON',prefix+'.params',`<textarea rows="3" id="${id(prefix+'.params')}" data-pref="${prefix}.params" placeholder="留空使用默认请求参数">${esc(get(prefix+'.params'))}</textarea>`)}</details>`;
    return body+`<section class="section">${detail}</section>`;
  }
  function sourceChoices(){return [['mineru-cloud','MinerU · 官方云端'],['mineru-local','MinerU · 本地服务'],['paddle-cloud','PaddleOCR · 官方 API'],['paddle-local','PaddleOCR · 自部署 API'],...modelChoices().map(([value,label])=>['ai:'+value,label])];}
  function identity(value){if(value.startsWith('mineru-'))return 'mineru';if(value.startsWith('paddle-'))return 'paddle';if(value.startsWith('ai:')){const parts=value.slice(3).split(':'),p=state.providers.find(provider=>provider.id===parts[0]);return p?'ai:'+p.models[Number(parts[1])].name.toLowerCase():value;}return value;}
  function collation(){
    const choices=sourceChoices(),allowed=choices.filter(([value])=>identity(value)!==identity(state.sourceA));
    return section('双引擎开关','需要提高转录可靠性时开启，额外调用对照识别服务。',toggle('dualEnabled','启用双引擎校勘','以 A 生成底稿，B 独立识别；分歧保留为待确认清单。'))+
    section('识别来源','模型和连接沿用对应服务中的配置。',`<fieldset ${state.dualEnabled?'':'disabled'}><div class="source-grid"><div class="source-box"><div class="source-label"><span class="source-letter">A</span><label for="${id('sourceA')}">主识别 · 底稿</label></div>${select('sourceA',choices)}<p class="help">保留原始结构与正文来源</p></div><div class="source-arrow" aria-hidden="true">⇄</div><div class="source-box"><div class="source-label"><span class="source-letter">B</span><label for="${id('sourceB')}">对照识别</label></div>${select('sourceB',[['','请选择另一种识别来源'],...allowed])}<p class="help">使用不同引擎或不同 AI 模型</p></div></div></fieldset><div class="actions"><button type="button" class="button link" data-page="extraction">配置识别服务 →</button><button type="button" class="button link" data-page="providers">配置 AI 模型 →</button></div>`)+
    section('分歧处理','疑字由用户核对原图后确认，不自动覆盖正文。',`<div class="definition"><dt>确认方式</dt><dd>人工查看原图，保留 A、采用 B 或手动修改。</dd></div><div class="definition"><dt>保存方式</dt><dd>保存校勘新版本，同时保留先前全文。</dd></div><div class="flowline"><span>A / B 独立识别</span><span>→</span><span>疑字清单</span><span>→</span><span>原图确认</span><span>→</span><span>新版本</span></div>`);
  }
  function output(){return section('全文格式','Markdown 始终保留；HTML 作为可选阅读版本。',toggle('generateHTML','同时生成 HTML','关闭后只保存 Markdown，已有附件不自动转换。')+field('HTML 图片方式','imageMode',select('imageMode',[['folder','独立 images 文件夹'],['inline','Base64 内嵌 · 单文件']],{disabled:!state.generateHTML}),'Markdown 图片始终使用独立文件。'))+
    section('文件关联','让后续总结、翻译和书目补充找到正确的正文。',toggle('linkSource','关联原文件与全文附件','使用 Zotero 相关项建立对应关系；重命名不会影响关联。'))+
    section('随全文保留','这些是转换结果的一部分，无需单独配置。',`<div class="filelist"><span>原始识别响应</span><span>结构与页码来源</span><span>整理差异报告</span><span>校勘记录</span></div><p class="inline-help">原始数据与过程记录保存在全文附件目录的 _ocrflow 文件夹中。</p><div class="actions"><button type="button" class="button link" data-work-link="translate">翻译格式与双栏模式在“翻译文档”中设置 →</button></div>`);}
  function tasks(){
    const labels={running:'处理中',queued:'排队中',failed:'失败',completed:'已完成',canceled:'已终止'};
    const rows=queueDraft.map((task,index)=>`<tr><td>${index+1}</td><td><div class="queue-file">${esc(task.file)}</div><small>${esc(task.work)}<br>${esc(task.service)}</small></td><td><span class="queue-state ${task.status}">${labels[task.status]}</span></td><td>${esc(task.progress)}</td><td><div class="queue-row-actions"><a href="ocrflow-task-sidebar.html?document=${task.id}&scene=${task.scene}">查看进度</a>${task.status==='failed'?`<button type="button" data-action="queue-retry" data-task="${task.id}">重试</button>`:''}${['running','queued'].includes(task.status)?`<button type="button" data-action="queue-stop" data-task="${task.id}">终止</button>`:''}<button type="button" data-action="queue-copy" data-task="${task.id}">复制</button></div></td></tr>`).join('');
    return section('全部文献任务','列表直接显示在设置页；任务操作无需保存设置。',`<p class="queue-summary">示例：共 ${queueDraft.length} 项 · ${queueDraft.filter(task=>task.status==='running').length} 项处理中 · ${queueDraft.filter(task=>task.status==='queued').length} 项排队中 · ${queueDraft.filter(task=>task.status==='failed').length} 项失败</p><table class="queue-table" aria-label="OCRFlow 所有文献的任务队列"><thead><tr><th>序号</th><th>文件 / 接口</th><th>状态</th><th>进度 / 错误</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="5">暂无任务记录。</td></tr>'}</tbody></table><div class="actions"><button type="button" class="button" data-action="queue-retry-all" ${queueDraft.some(task=>task.status==='failed')?'':'disabled'}>重试全部失败项</button><button type="button" class="button" data-action="queue-clear" ${queueDraft.some(task=>['completed','failed','canceled'].includes(task.status))?'':'disabled'}>清除已结束任务</button></div><p class="inline-help">单篇文献的步骤流显示在主界面右侧 OCRFlow 面板中。</p>`)+
    section('本地 MinerU 任务','查询已提交到本地 V1 服务的任务。',field('任务 ID','jobID',input('jobID',{placeholder:'留空使用最近提交的任务'}))+`<div class="actions aligned"><button type="button" class="button" data-action="query-job">查询任务进度</button></div><p class="feedback" id="of-job-feedback" aria-live="polite"></p>`)+
    section('运行说明','',`<div class="definition"><dt>记录范围</dt><dd>任务队列和未完成译段保留在当前 Zotero 会话中。</dd></div><div class="definition"><dt>重试设置</dt><dd>任务重试读取最新保存的配置；已完成步骤按流程复用。</dd></div><div class="actions"><button type="button" class="button link" data-page="extraction">连接超时与等待参数在提取服务中设置 →</button><a class="button link" href="ocrflow-task-sidebar.html">查看右侧任务面板设计 →</a></div>`);}
  function render(){
    const [title,intro]=pageInfo[page];root.querySelectorAll('[data-page]').forEach(button=>{if(button.classList.contains('navitem')){const active=button.dataset.page===page;button.setAttribute('aria-selected',String(active));if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');}});
    const content={extraction,providers,work:workView,collation,output,tasks}[page]();
    main.setAttribute('aria-labelledby','of-tab-'+page);
    main.innerHTML=`<div class="pagehead"><h1>${title}</h1><p class="intro">${intro}</p></div>${content}`;updateSave();
  }
  root.addEventListener('input',event=>{const control=event.target;if(!control.dataset.pref||control.type==='checkbox'||control.tagName==='SELECT')return;set(control.dataset.pref,control.type==='number'?Number(control.value):control.value);});
  root.addEventListener('change',event=>{
    const control=event.target;
    if(control.dataset.pref){const key=control.dataset.pref;set(key,control.type==='checkbox'?control.checked:control.type==='number'?Number(control.value):control.value);
      if(key==='defaultService')service=state.defaultService;
      if(key==='sourceA'&&identity(state.sourceA)===identity(state.sourceB)){state.sourceB='';toast('主识别已改变，请为 B 重新选择不同的引擎。');}
      if(control.type==='checkbox'||control.tagName==='SELECT')render();
    }
    if(control.dataset.mode){state[control.dataset.mode+'Mode']=control.value;markDirty();render();}
  });
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.page){page=button.dataset.page;render();toast('');return;}
    if(button.dataset.service){service=button.dataset.service;render();return;}
    if(button.dataset.provider!==undefined){providerIndex=Number(button.dataset.provider);render();return;}
    if(button.dataset.work){work=button.dataset.work;render();return;}
    if(button.dataset.workLink){page='work';work=button.dataset.workLink;render();return;}
    if(button.dataset.reveal){const input=root.querySelector('#'+button.dataset.reveal);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'显示':'隐藏';return;}
    if(button.dataset.test){toast(`${button.dataset.test}：连接结果将在此反馈。本设计稿不发送网络请求。`);return;}
    const action=button.dataset.action;
    if(action==='save'){saved=structuredClone(state);dirty=false;updateSave();root.querySelector('#of-save-status').textContent='本次预览已保存';toast('仅记录本页预览状态，不会修改 Zotero 设置。');}
    if(action==='discard'){state=structuredClone(saved);providerIndex=Math.min(providerIndex,state.providers.length-1);dirty=false;render();toast('已放弃本次未保存修改。');}
    if(action==='reset-prompt'){set(`works.${work}.prompt`,prompts[work]);render();toast('已恢复预览中的内置提示词，保存后生效。');}
    if(action==='add-provider'&&state.providers.length<5){const index=state.providers.length;state.providers.push({id:'extra'+Date.now(),name:`接口 ${index+1}`,url:'',key:'',models:[{name:'',context:'',output:'',concurrency:1},{name:'',context:'',output:'',concurrency:1}]});providerIndex=index;markDirty();render();}
    if(action==='delete-provider'&&state.providers.length>1){const provider=state.providers[providerIndex];if([state.defaultModel,...Object.values(state.works).map(item=>item.model),state.sourceA.replace(/^ai:/,''),state.sourceB.replace(/^ai:/,'')].some(value=>value.startsWith(provider.id+':'))){toast('此接口仍被工作或校勘使用，请先重新分配模型。');return;}state.providers.splice(providerIndex,1);providerIndex=Math.max(0,providerIndex-1);markDirty();render();}
    if(action==='queue-retry'||action==='queue-retry-all'){for(const task of queueDraft)if(task.status==='failed'&&(action==='queue-retry-all'||task.id===button.dataset.task)){task.status='queued';task.progress='等待重试未完成部分，已完成结果保留';task.scene='queued';}render();toast('演示：失败项已重新排队，已完成结果保留。');}
    if(action==='queue-stop'){const task=queueDraft.find(task=>task.id===button.dataset.task);if(task){task.status='canceled';task.progress='已停止后续处理，保留已有结果';task.scene='canceled';}render();toast('演示：此任务已终止。');}
    if(action==='queue-clear'){for(let i=queueDraft.length-1;i>=0;i--)if(['completed','failed','canceled'].includes(queueDraft[i].status))queueDraft.splice(i,1);render();toast('演示：只清除已结束记录，运行与排队任务保留。');}
    if(action==='queue-copy'){const task=queueDraft.find(task=>task.id===button.dataset.task);if(task){const text=[task.file,task.work,task.service,labelsForCopy(task.status),task.progress].join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制此条示例任务。')).catch(()=>toast(text));else toast(text);}}
    if(action==='query-job'){root.querySelector('#of-job-feedback').textContent=state.jobID?`查询目标：${state.jobID}\n这里展示服务返回的任务状态与实际进度。`:'将查询最近提交的本地任务。这里展示实际进度或错误信息。';}
  });
  function labelsForCopy(status){return {running:'处理中',queued:'排队中',failed:'失败',completed:'已完成',canceled:'已终止'}[status];}
  render();
})();
</script>
</body>
</html>
